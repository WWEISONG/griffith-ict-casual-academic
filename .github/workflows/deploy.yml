name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages using OIDC rather than a token.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; cancel a superseded run mid-flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Smoke test (authorisation rules)
        run: npm run smoke

      - name: Build
        env:
          # Project sites are served from /<repo>/, so the bundle must be built
          # with a matching base path.
          VITE_BASE: /${{ github.event.repository.name }}/
          # Public Supabase credentials. The anon key is safe to expose: every
          # table is protected by row level security. Set these as repository
          # variables (Settings -> Secrets and variables -> Actions -> Variables).
          # With them unset the site falls back to in-browser sample data.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
